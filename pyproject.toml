[project]
name = "django_base"
version = "0.1.0"
description = ""
authors = [
    {name = "Gustavo-Alberico",email = "gustavoalberico@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
