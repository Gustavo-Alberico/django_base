    "cachetools (==6.2.1)",
    "certifi (==2025.10.5)",
    "charset-normalizer (==3.4.4)",
    "django (==5.2.7)",
    "django-cors-headers (==4.9.0)",
    "djangorestframework (==3.16.1)",
    "djangorestframework-simplejwt (==5.5.1)",
    "google-auth (==2.42.1)",
    "idna (==3.11)",
    "pyasn1 (==0.6.1)",
    "pyasn1-modules (==0.4.2)",
    "pyjwt (==2.10.1)",
    "python-decouple (==3.8)",
    "requests (==2.32.5)",
    "rsa (==4.9.1)",
    "sqlparse (==0.5.3)",
    "tzdata (==2025.2)",
    "urllib3 (==2.5.0)",
    "pillow (>=12.0.0,<13.0.0)"
